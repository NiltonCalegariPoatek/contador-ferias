<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de Férias do Nilton</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  /* Camadas do blueprint quadriculado em parallax */
  .grid-layer {
    position: fixed;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    pointer-events: none;
    will-change: transform;
  }

  /* Grade fina (quadradinhos pequenos) — camada de fundo, deriva devagar */
  #grid-fine {
    background-image:
      linear-gradient(rgba(30, 110, 220, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 110, 220, 0.10) 1px, transparent 1px);
    background-size: 20px 20px;
    animation: driftNW-fine 5s linear infinite;
  }

  /* Grade média (a cada 5 quadradinhos) — deriva em velocidade média */
  #grid-medium {
    background-image:
      linear-gradient(rgba(30, 110, 220, 0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 110, 220, 0.18) 1px, transparent 1px);
    background-size: 100px 100px;
    animation: driftNW-medium 8s linear infinite;
  }

  /* Grade grossa (linhas-mestras) — camada da frente, deriva mais rápido */
  #grid-bold {
    background-image:
      linear-gradient(rgba(30, 110, 220, 0.28) 2px, transparent 2px),
      linear-gradient(90deg, rgba(30, 110, 220, 0.28) 2px, transparent 2px);
    background-size: 300px 300px;
    animation: driftNW-bold 10s linear infinite;
  }

  /* Deriva automática rumo ao noroeste (cima-esquerda), um tile por ciclo = loop perfeito */
  @keyframes driftNW-fine {
    to { background-position: -20px -20px; }
  }
  @keyframes driftNW-medium {
    to { background-position: -100px -100px; }
  }
  @keyframes driftNW-bold {
    to { background-position: -300px -300px; }
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100vh;
    height: 100dvh; /* considera a barra de endereço dos navegadores mobile */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    text-align: center;
    padding: 24px;
    padding-bottom: 80px; /* espaço para o footer fixo não cobrir o conteúdo */
  }

  /* Label estilo arco-íris letra a letra (como W o N d E r F u L W o R l D) */
  .label {
    font-size: clamp(1.4rem, 4vw, 2.8rem);
    font-weight: 800;
    letter-spacing: 3px;
    white-space: pre-wrap;
  }

  .rgb-letter {
    display: inline-block;
    color: #ff0040;
    text-shadow: 0 0 14px rgba(255, 0, 64, 0.35);
    animation: hueSpin 2.4s linear infinite, letterWave 1.6s ease-in-out infinite;
  }

  /* Cada letra gira o matiz — os delays em JS criam a onda de cores */
  @keyframes hueSpin {
    to { filter: hue-rotate(360deg); }
  }

  @keyframes letterWave {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-7px) scale(1.12); }
  }

  @keyframes rgbPulse {
    0%   { color: #ff0040; text-shadow: 0 0 24px rgba(255, 0, 64, 0.45); }
    16%  { color: #ff8000; text-shadow: 0 0 24px rgba(255, 128, 0, 0.45); }
    33%  { color: #ffd000; text-shadow: 0 0 24px rgba(255, 208, 0, 0.45); }
    50%  { color: #00c840; text-shadow: 0 0 24px rgba(0, 200, 64, 0.45); }
    66%  { color: #00a0ff; text-shadow: 0 0 24px rgba(0, 160, 255, 0.45); }
    83%  { color: #8000ff; text-shadow: 0 0 24px rgba(128, 0, 255, 0.45); }
    100% { color: #ff0040; text-shadow: 0 0 24px rgba(255, 0, 64, 0.45); }
  }

  @keyframes pulseScale {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  .sublabel {
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444;
    margin-top: -24px;
  }

  /* Contador */
  .countdown {
    position: relative;
    display: flex;
    gap: clamp(12px, 4vw, 40px);
    align-items: flex-start;
  }

  /* Badge de urgência estilo adesivo no canto do contador */
  .badge {
    position: absolute;
    top: -30px;
    right: -14px;
    z-index: 5;
    background: #e0002a;
    color: #fff;
    font-size: clamp(0.75rem, 2vw, 1rem);
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 6px 18px rgba(224, 0, 42, 0.45);
    white-space: nowrap;
    animation: badgeWiggle 0.8s ease-in-out infinite;
  }

  @keyframes badgeWiggle {
    0%, 100% { transform: rotate(5deg) scale(1); }
    50%      { transform: rotate(11deg) scale(1.08); }
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .value {
    font-family: 'Courier New', monospace;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 900;
    color: #111;
    background: rgba(255, 255, 255, 0.82);
    border: 3px solid #111;
    border-radius: 16px;
    padding: clamp(10px, 2vw, 24px) clamp(14px, 3vw, 32px);
    min-width: clamp(90px, 18vw, 190px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    font-variant-numeric: tabular-nums;
  }

  .unit-label {
    font-size: clamp(0.8rem, 2vw, 1.2rem);
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #333;
  }

  .separator {
    font-family: 'Courier New', monospace;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 900;
    color: #111;
    padding-top: clamp(10px, 2vw, 24px);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }

  /* Footer com a data de retorno */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 15;
    text-align: center;
    padding: 14px 16px;
    font-size: clamp(0.9rem, 2.2vw, 1.2rem);
    font-weight: 700;
    letter-spacing: 1px;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    border-top: 2px solid rgba(30, 110, 220, 0.28);
    backdrop-filter: blur(2px);
  }

  .footer .return-date {
    color: #e0002a;
    font-family: 'Courier New', monospace;
    font-weight: 900;
  }

  /* Botão de socorro via Slack */
  .help-btn {
    font-family: inherit;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 800;
    padding: 16px 32px;
    border-radius: 999px;
    border: 3px solid #111;
    background: #611f69; /* roxo do Slack */
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(97, 31, 105, 0.35);
    animation: pulseScale 1.5s ease-in-out infinite;
  }

  .help-btn:hover {
    background: #7c2d87;
  }

  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 30;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }

  #toast.show { opacity: 1; }

  /* Botão para ativar o giroscópio (aparece só no iOS, que exige permissão) */
  #gyro-btn {
    position: fixed;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    padding: 12px 20px;
    border-radius: 999px;
    border: 2px solid #111;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    cursor: pointer;
  }

  .done {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 900;
    animation: rgbPulse 2s linear infinite, pulseScale 1s ease-in-out infinite;
  }

  /* ---- Responsivo: telas estreitas (celular em pé) ---- */
  @media (max-width: 600px) {
    .content {
      gap: 28px;
      padding: 16px 12px 90px;
    }

    .label {
      font-size: 1.15rem;
      letter-spacing: 1px;
    }

    .sublabel {
      font-size: 0.9rem;
      margin-top: -12px;
    }

    .countdown {
      gap: 6px;
    }

    .value {
      font-size: clamp(1.8rem, 11vw, 3rem);
      min-width: 0;
      padding: 10px 8px;
      border-width: 2px;
      border-radius: 12px;
    }

    .separator {
      font-size: clamp(1.8rem, 11vw, 3rem);
      padding-top: 10px;
    }

    .unit-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
    }

    /* Badge centralizado acima do contador para não estourar a lateral */
    .badge {
      top: -38px;
      right: 0;
      left: 0;
      margin: 0 auto;
      width: max-content;
      font-size: 0.7rem;
      padding: 6px 12px;
    }

    .help-btn {
      font-size: 1rem;
      padding: 12px 20px;
      max-width: 92vw;
    }

    .footer {
      font-size: 0.85rem;
      padding: 10px 12px;
    }

    #toast {
      font-size: 0.85rem;
      bottom: 130px;
    }

    #gyro-btn {
      font-size: 0.9rem;
      padding: 10px 16px;
      bottom: 60px;
    }
  }

  /* ---- Responsivo: telas baixas (celular deitado) ---- */
  @media (max-height: 520px) {
    .content {
      gap: 14px;
      padding-bottom: 60px;
    }

    .label { font-size: 1.1rem; }
    .sublabel { font-size: 0.85rem; margin-top: -6px; }

    .value {
      font-size: 2rem;
      min-width: 0;
      padding: 6px 14px;
    }

    .separator { font-size: 2rem; padding-top: 6px; }
    .unit-label { font-size: 0.6rem; }
    .badge { top: -26px; font-size: 0.65rem; padding: 5px 10px; }
    .help-btn { font-size: 0.9rem; padding: 8px 18px; }
    .footer { font-size: 0.8rem; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div id="grid-fine"   class="grid-layer"></div>
<div id="grid-medium" class="grid-layer"></div>
<div id="grid-bold"   class="grid-layer"></div>

<div class="content">
  <div class="label">Aproveite ajuda do Nilton antes que ele saia de férias</div>

  <div class="sublabel">restam apenas:</div>

  <div class="countdown" id="countdown">
    <div class="badge">⏰ O tempo tá acabando!</div>
    <div class="unit">
      <div class="value" id="hours">00</div>
      <div class="unit-label">HORAS</div>
    </div>
    <div class="separator">:</div>
    <div class="unit">
      <div class="value" id="minutes">00</div>
      <div class="unit-label">MINUTOS</div>
    </div>
    <div class="separator">:</div>
    <div class="unit">
      <div class="value" id="seconds">00</div>
      <div class="unit-label">SEGUNDOS</div>
    </div>
  </div>

  <button class="help-btn" id="help-btn">🆘 ME AJUDE! — chamar o Nilton no Slack</button>
</div>

<footer class="footer">
  Nilton voltará apenas em: <span class="return-date">08/09/2026</span> 🏖️
</footer>

<div id="toast"></div>

<script>
  // ---- Contador regressivo: férias começam 21/08/2026 às 17:00 (horário local) ----
  const TARGET = new Date('2026-08-21T17:00:00');

  const hoursEl   = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');

  function tick() {
    const diff = TARGET - new Date();

    if (diff <= 0) {
      countdownEl.outerHTML = '<div class="done">🏖️ NILTON ESTÁ DE FÉRIAS! 🏖️</div>';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    hoursEl.textContent   = String(h).padStart(2, '0');
    minutesEl.textContent = String(m).padStart(2, '0');
    secondsEl.textContent = String(s).padStart(2, '0');
  }

  const timer = setInterval(tick, 1000);
  tick();

  // ---- Label arco-íris letra a letra (estilo W o N d E r F u L W o R l D) ----
  const labelEl = document.querySelector('.label');
  const text = labelEl.textContent;
  labelEl.textContent = '';

  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'rgb-letter';
    span.textContent = ch;
    // Delay negativo por letra: cria a onda de cor e de movimento percorrendo o texto
    span.style.animationDelay = `${-i * 0.12}s, ${-i * 0.12}s`;
    labelEl.appendChild(span);
  });

  // ---- Parallax com o movimento do mouse (cada camada da grade numa profundidade diferente) ----
  const gridLayers = document.querySelectorAll('.grid-layer');
  const depths = [10, 25, 45]; // px de deslocamento máximo por camada
  let targetX = 0, targetY = 0, curX = 0, curY = 0;

  window.addEventListener('mousemove', (e) => {
    targetX = (e.clientX / window.innerWidth  - 0.5) * 2;  // -1 a 1
    targetY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  function animateParallax() {
    curX += (targetX - curX) * 0.06;
    curY += (targetY - curY) * 0.06;

    gridLayers.forEach((layer, i) => {
      layer.style.transform =
        `translate(${-curX * depths[i]}px, ${-curY * depths[i]}px)`;
    });

    requestAnimationFrame(animateParallax);
  }
  animateParallax();

  // ---- Botão de socorro via Slack ----
  // O Slack não aceita texto pré-preenchido em links de DM, então o botão copia
  // "ME AJUDE!" para a área de transferência e abre a conversa — é só colar e enviar.
  // Preencha com os seus IDs do Slack:
  //   SLACK_TEAM_ID: na URL do Slack no navegador, app.slack.com/client/T.../ (começa com T)
  //   SLACK_USER_ID: seu perfil → ⋮ (três pontos) → "Copiar ID do membro" (começa com U)
  const SLACK_ORG_ID  = 'E03RF3RQZU6'; // ID da organização (Enterprise Grid)
  const SLACK_USER_ID = 'U03EQJW11BM'; // member ID do Nilton
  const SLACK_DOMAIN  = 'poatek';      // subdomínio do workspace (<dominio>.slack.com)

  const helpBtn = document.getElementById('help-btn');
  const toastEl = document.getElementById('toast');

  helpBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText('ME AJUDE!');
      toastEl.textContent = '✅ "ME AJUDE!" copiado — cole (Ctrl+V) no chat e envie!';
    } catch {
      toastEl.textContent = 'Abrindo o Slack…';
    }
    toastEl.classList.add('show');

    // 1ª tentativa: abrir o app do Slack direto na DM (protocolo slack:// aceita o ID E...)
    setTimeout(() => {
      window.location.href = `slack://user?team=${SLACK_ORG_ID}&id=${SLACK_USER_ID}`;
    }, 600);

    // 2ª tentativa: se o app não abriu (a página continua visível), abre o perfil na web
    setTimeout(() => {
      if (!document.hidden) {
        window.open(`https://${SLACK_DOMAIN}.slack.com/team/${SLACK_USER_ID}`, '_blank');
      }
    }, 2200);

    setTimeout(() => toastEl.classList.remove('show'), 4000);
  });

  // ---- Parallax com giroscópio no celular ----
  // A primeira leitura vira a posição "neutra"; a inclinação a partir dela move as grades
  let baseBeta = null, baseGamma = null;

  function handleOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
    const clamp = v => Math.max(-1, Math.min(1, v));
    targetX = clamp((e.gamma - baseGamma) / 25); // inclinar p/ os lados
    targetY = clamp((e.beta - baseBeta) / 25);   // inclinar p/ frente/trás
  }

  function enableGyro() {
    window.addEventListener('deviceorientation', handleOrientation);
  }

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+: o sensor só libera com permissão concedida a partir de um toque
    const btn = document.createElement('button');
    btn.id = 'gyro-btn';
    btn.textContent = '📱 Ativar movimento';
    document.body.appendChild(btn);
    btn.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission()
        .then(state => { if (state === 'granted') enableGyro(); })
        .catch(() => {});
      btn.remove();
    });
  } else if ('DeviceOrientationEvent' in window) {
    // Android e demais navegadores: funciona direto
    enableGyro();
  }
</script>

</body>
</html>
